{% extends "store/base.html" %}
{% block title %}Page Not Found — {{ business_name }}{% endblock %}
{% block content %}
<section class="section" style="padding:90px 0; text-align:center;">
  <div class="wrap" style="max-width:520px;">
    <span class="eyebrow">Error 404</span>
    <h1>We couldn't find that page.</h1>
    <p>The link might be broken, or the page may have moved. Try browsing our current inventory instead.</p>
    <div class="hero-actions" style="justify-content:center;">
      <a class="btn btn-primary" href="{{ url_for('store.home') }}">Back to Home</a>
      <a class="btn btn-outline" href="{{ url_for('store.browse') }}">Browse Cars</a>
    </div>
  </div>
</section>
{% endblock %}
