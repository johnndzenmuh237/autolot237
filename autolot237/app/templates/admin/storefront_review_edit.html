{% extends "base.html" %}
{% block title %}Edit Review{% endblock %}

{% block content %}
<div class="section-head" style="margin-top:0;">
  <h2>Edit Review</h2>
  <div class="page-actions"><a href="{{ url_for('store_admin.reviews') }}" class="btn btn-secondary">Back</a></div>
</div>

<div class="card" style="padding:24px; max-width:560px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field"><label>Reviewer Name</label><input type="text" name="reviewer_name" value="{{ review.reviewer_name }}" required></div>
    <div class="form-field">
      <label>Rating</label>
      <select name="rating">
        {% for i in range(5,0,-1) %}<option value="{{ i }}" {{ 'selected' if review.rating == i }}>{{ i }} star{{ 's' if i != 1 }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-field"><label>Comment</label><textarea name="comment" rows="5" required>{{ review.comment }}</textarea></div>
    <button class="btn btn-primary" type="submit">Save Changes</button>
  </form>
</div>
{% endblock %}
