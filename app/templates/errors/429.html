<!DOCTYPE html>
<html lang="en">
<head>

<title>Too Many Requests</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

<body style="display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:12px; background:var(--bg); text-align:center; padding:20px;">
