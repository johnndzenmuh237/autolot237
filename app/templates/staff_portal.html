{% extends "base.html" %}
{% block title %}Staff sign in{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card" style="text-align:center;">
    <div class="auth-brand" style="justify-content:center;">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="AutoLot237 logo" width="40" height="40" style="border-radius:10px;">
      <span class="brand-name" style="color:var(--ink);">Ledger<em style="color:var(--accent);">IQ</em></span>
    </div>
    <h2 class="auth-title">Staff sign in</h2>
    <p class="auth-subtitle">Choose your login.</p>

    <div style="display:flex; flex-direction:column; gap:12px; margin-top:10px;">
      <a class="btn btn-primary btn-block" href="{{ url_for('auth.login') }}">Admin Login</a>
      <a class="btn btn-secondary btn-block" href="{{ url_for('auth.seller_login') }}">Seller Login</a>
      <a class="btn btn-secondary btn-block" href="{{ url_for('auth.worker_login') }}">Worker Login</a>
    </div>
  </div>
  <p class="auth-footer-note">LedgerIQ Business Management Dashboard</p>
</div>
{% endblock %}
