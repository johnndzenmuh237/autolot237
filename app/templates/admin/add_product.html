{% extends "base.html" %}
{% set page_title = "Add Product" %}
{% set page_subtitle = "Add a new item to your inventory" %}
{% block title %}Add Product{% endblock %}

{% block content %}
<div class="card" style="max-width: 620px;">
  <form method="POST" action="{{ url_for('inventory.add_product') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-row">
      <div class="form-group">
        <label for="name">Product Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Dell Latitude 5400" required>
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" placeholder="e.g. Laptops" required list="categoryList">
        <datalist id="categoryList">
          <option value="Laptops"></option>
          <option value="Accessories"></option>
        </datalist>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="sku">SKU (optional)</label>
        <input type="text" id="sku" name="sku" placeholder="e.g. DELL-5400">
      </div>
      <div class="form-group">
        <label for="stock_quantity">Starting Stock</label>
        <input type="number" id="stock_quantity" name="stock_quantity" min="0" value="0" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cost_price">Purchase Cost (per unit)</label>
        <input type="number" id="cost_price" name="cost_price" min="0" step="1" required>
      </div>
      <div class="form-group">
        <label for="low_stock_threshold">Low Stock Threshold</label>
        <input type="number" id="low_stock_threshold" name="low_stock_threshold" min="0" value="5" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="min_price">Minimum Selling Price</label>
        <input type="number" id="min_price" name="min_price" min="0" step="1" required>
      </div>
      <div class="form-group">
        <label for="max_price">Maximum Selling Price</label>
        <input type="number" id="max_price" name="max_price" min="0" step="1" required>
      </div>
    </div>

    <div class="form-hint" style="margin-bottom: 18px;">
      Sellers will only be able to sell within the min/max price range you set here.
    </div>

    <button type="submit" class="btn btn-primary">Add Product</button>
    <a href="{{ url_for('inventory.list_products') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
