{% extends "base.html" %}
{% set page_title = "Add Employee" %}
{% set page_subtitle = "Register a new employee with full contact and payroll details" %}
{% block title %}Add Employee{% endblock %}

{% block content %}
<div class="card" style="max-width: 680px;">
  <form method="POST" action="{{ url_for('auth.register_seller') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="section-head" style="margin-top:0;"><h2 style="font-size:0.95rem;">Login Details</h2></div>
    <div class="form-row">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form.get('full_name','') }}" required>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ form.get('username','') }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="password">Temporary Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="email">Email (optional)</label>
        <input type="email" id="email" name="email" value="{{ form.get('email','') }}">
      </div>
    </div>

    <div class="divider"></div>
    <div class="section-head" style="margin-top:0;"><h2 style="font-size:0.95rem;">Contact Details</h2></div>
    <div class="form-row">
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" value="{{ form.get('phone','') }}" placeholder="e.g. +237 6XX XXX XXX" required>
      </div>
      <div class="form-group">
        <label for="national_id">National ID / CNI (optional)</label>
        <input type="text" id="national_id" name="national_id" value="{{ form.get('national_id','') }}">
      </div>
    </div>
    <div class="form-group">
      <label for="address">Residential Address</label>
      <input type="text" id="address" name="address" value="{{ form.get('address','') }}" placeholder="Neighborhood, city" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="emergency_contact_name">Emergency Contact Name (optional)</label>
        <input type="text" id="emergency_contact_name" name="emergency_contact_name" value="{{ form.get('emergency_contact_name','') }}">
      </div>
      <div class="form-group">
        <label for="emergency_contact_phone">Emergency Contact Phone (optional)</label>
        <input type="text" id="emergency_contact_phone" name="emergency_contact_phone" value="{{ form.get('emergency_contact_phone','') }}">
      </div>
    </div>

    <div class="divider"></div>
    <div class="section-head" style="margin-top:0;"><h2 style="font-size:0.95rem;">Employment Details</h2></div>
    <div class="form-row">
      <div class="form-group">
        <label for="position">Position</label>
        <input type="text" id="position" name="position" value="{{ form.get('position','') }}" placeholder="e.g. Shop Attendant" required>
      </div>
      <div class="form-group">
        <label for="hire_date">Hire Date</label>
        <input type="date" id="hire_date" name="hire_date" value="{{ form.get('hire_date','') }}" required>
      </div>
    </div>
    <div class="form-group">
      <label for="salary">Monthly Salary</label>
      <input type="number" id="salary" name="salary" min="0" step="1" value="{{ form.get('salary','') }}" required>
    </div>
    <div class="form-group">
      <label for="notes">Notes (optional)</label>
      <textarea id="notes" name="notes" rows="3" placeholder="Anything else worth recording about this employee">{{ form.get('notes','') }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Register Employee</button>
    <a href="{{ url_for('admin.employees') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
