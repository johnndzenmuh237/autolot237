{% extends "base.html" %}
{% block title %}Seller sign in{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">L</span>
      <span class="brand-name" style="color:var(--ink);">Ledger<em style="color:var(--accent);">IQ</em></span>
    </div>
    <h2 class="auth-title">Seller sign in</h2>
    <p class="auth-subtitle">Record in-store sales and view website orders.</p>

    <form method="POST" action="{{ url_for('auth.seller_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
  <p class="auth-footer-note">LedgerIQ Business Management Dashboard</p>
</div>
{% endblock %}
