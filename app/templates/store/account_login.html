{% extends "store/base.html" %}
{% block title %}Sign In — {{ business_name }}{% endblock %}
{% block content %}
<div class="store-auth-wrap">
  <div class="store-auth-card">
    <div class="brand">&#10022; <span>{{ business_name }}</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to track your orders and balance</p>

    <form method="POST" action="{{ url_for('account.login') }}">
      <div class="form-field"><label>Phone Number</label><input type="tel" name="phone" required autofocus></div>
      <div class="form-field"><label>Password</label><input type="password" name="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="foot">Don't have an account? <a href="{{ url_for('account.signup') }}">Create one free →</a></div>

    <div style="margin-top:28px; padding-top:24px; border-top:1px solid var(--clr-border);">
      <p style="font-weight:700; color:var(--clr-text); font-size:.88rem; margin-bottom:12px;">Or just track one order</p>
      <form method="POST" action="{{ url_for('account.track_order') }}">
        <div class="form-field"><label>Order Number</label><input type="text" name="order_number" placeholder="AL-260101-1234" required></div>
        <div class="form-field"><label>Phone Number</label><input type="tel" name="phone" required></div>
        <button type="submit" class="btn btn-outline btn-block">Track Order</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
